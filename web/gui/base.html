<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand-kicker">Apothicaire Culinaire</div>
            <h1>{{ header_title }}</h1>
            <p>{{ header_subtitle }}</p>
        </div>

        <div class="tabs">
            {% for tab_id, tab_name in tabs.items() %}
                <button class="tab {% if loop.first %}active{% endif %}" onclick="switchTab('{{ tab_id }}')">{{ tab_name }}</button>
            {% endfor %}
        </div>

        {% block tabs_content %}{% endblock %}
    </div>

    <script>
        // Configuration injectée par le serveur Jinja2
        const API_BASE = '{{ api_base }}';
    </script>
    <script src="app.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>

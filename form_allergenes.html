<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulaire Allergènes UE</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      line-height: 1.5;
      color: #222;
      background: #fafafa;
    }

    .form-group {
      max-width: 760px;
      background: #fff;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    label {
      display: inline-block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    select {
      width: 100%;
      min-height: 260px;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: #fff;
    }

    option {
      padding: 6px;
    }

    small {
      display: block;
      margin-top: 10px;
      color: #555;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 16px;
    }

    .note {
      margin-top: 16px;
      padding: 12px;
      background: #f4f6f8;
      border-left: 4px solid #666;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="form-group">
    <h1>Choix des allergènes (UE)</h1>

    <label for="allergenes">Allergènes (UE) :</label>
    <select id="allergenes" name="allergenes[]" multiple size="14" aria-describedby="help-allergenes">
      <option value="gluten" data-eu="1">Céréales contenant du gluten (blé, seigle, orge, avoine, épeautre, kamut…)</option>
      <option value="crustaces" data-eu="2">Crustacés</option>
      <option value="oeufs" data-eu="3">Œufs</option>
      <option value="poissons" data-eu="4">Poissons</option>
      <option value="arachides" data-eu="5">Arachides (cacahuètes)</option>
      <option value="soja" data-eu="6">Soja</option>
      <option value="lait" data-eu="7">Lait</option>
      <option value="fruits-a-coque" data-eu="8">Fruits à coque (amandes, noisettes, noix, cajou, pécan, noix du Brésil, pistache, macadamia…)</option>
      <option value="celeri" data-eu="9">Céleri</option>
      <option value="moutarde" data-eu="10">Moutarde</option>
      <option value="sesame" data-eu="11">Graines de sésame</option>
      <option value="sulfites" data-eu="12">Anhydride sulfureux et sulfites (&gt; 10 mg/kg ou L)</option>
      <option value="lupin" data-eu="13">Lupin</option>
      <option value="mollusques" data-eu="14">Mollusques</option>
    </select>

    <small id="help-allergenes">
      Maintenir Ctrl (Windows/Linux) ou Cmd (Mac) pour sélectionner plusieurs allergènes.
    </small>

    <div class="note">
      Ce composant utilise la liste des 14 allergènes majeurs reconnus par la réglementation UE.
    </div>
  </div>
</body>
</html>

[package]
name = "code-terroir"
version = "0.1.0"
edition = "2021"
authors = ["Code Terroir Team"]
description = "Plateforme de traçabilité pour producteurs artisanaux"
license = "MIT"

[[bin]]
name = "code-terroir"
path = "src/main.rs"

[dependencies]
# Web framework
warp = { version = "0.3", features = ["compression"] }
tokio = { version = "1.0", features = ["full"] }

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "ipnetwork"] }

# Redis for caching and jobs
redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Authentication & Security
jsonwebtoken = "9.0"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
qrcode = "0.14"

# Configuration
dotenv = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-opentelemetry = "0.22"
opentelemetry = "0.21"
opentelemetry-jaeger = "0.20"

gwl_logger = { git = "https://github.com/gotoo77/gwl_logger.git", rev = "969a19f43588b6a6b97c126bfcb7324127d68bd6" }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# PDF generation
wkhtmltopdf = "0.4"

image = "0.24"

# File handling
tempfile = "3.0"
mime = "0.3"
mime_guess = "2.0"

# CORS and security headers
tower = "0.4"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }

# Rate limiting
governor = "0.6"

# Metrics
prometheus = "0.13"

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
